<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="min-height: 100vh; background: radial-gradient(circle at 50% -10%, rgba(57,217,255,.10), transparent 35%), #07090c; color: #f2f5f7; font-family: Inter, system-ui, -apple-system, sans-serif; padding: 42px 18px 70px; box-sizing: border-box;">
      <style>
        .wrap { width: min(980px, 100%); margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 13px 0 2px; font-size: clamp(42px, 8vw, 72px); line-height: .95; letter-spacing: -.055em; color: #f2f5f7; }
        h1 span { color: #39d9ff; }
        h4 { margin: 11px 0 0; color: #8995a3; font-size: 14px; font-weight: 500; }
        .search { width: 100%; margin: 20px 0 15px; padding: 15px 17px; color: #f2f5f7; background: #0d1117; border: 1px solid rgba(255,255,255,.09); border-radius: 13px; outline: none; font-size: 15px; box-sizing: border-box; }
        .search:focus { border-color: rgba(57,217,255,.55); box-shadow: 0 0 0 3px rgba(57,217,255,.07); }
        .list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
        .game { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 15px 16px; color: #f2f5f7; text-decoration: none; background: linear-gradient(145deg, #0d1117, #111720); border: 1px solid rgba(255,255,255,.09); border-radius: 13px; box-sizing: border-box; }
        .game:hover { border-color: rgba(57,217,255,.42); background: #121b23; }
        .dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #39d9ff; box-shadow: 0 0 12px rgba(57,217,255,.55); }
        .game span:nth-child(2) { flex: 1; font-weight: 650; }
        .arrow { color: #667381; font-size: 18px; }
        .empty { display: none; text-align: center; color: #8995a3; padding: 35px; }
        footer { text-align: center; margin-top: 26px; color: #596572; font-size: 11px; }
      </style>

      <div class="wrap">
        <header>
          <h1>Wizzy <span>Hub</span></h1>
          <h4>Feeling Tuff Today</h4>
        </header>

        <input id="search" class="search" type="search" placeholder="🔎 Search the hub..." autocomplete="off" />

        <main id="list" class="list">
          <a class="game" href="https://cdn.jsdelivr.net/gh/obamamegagon/linkmaker@main/sigmagames.svg?1" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Sigma Games (has everything)</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/ohioisgay/web-auto-1@main/web-1.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>random games ~1300</span><span class="arrow">↗</span></a>
          <a class="game" href="https://quizizz.com/_media/aeos/32e0e8ae-4dbd-4739-8974-abecd08eecff-v2" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Aeos (V4)</span><span class="arrow">↗</span></a>
          <a class="game" href="https://testingcf.jsdelivr.net/gh/linuxfandudeguy/classwork-chemistry@main/ixl.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>MelonSoda</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/reeyuki/YukiOsSingleHtml@main/yukios.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>YukiOS</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/dorianhagar506-coder/nikehub-d3yiip@main/nikehub-1-g1y7.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>NikeHub</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/dorianhagar506-coder/idk-1tlupq@main/DarkNUX-1-j78t.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>DarkNUX</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/dorianhagar506-coder/mizu--lrq2df@main/mizu-4-aqng.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Mizu</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/zaka13alt/bio@main/p2p.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>P2P / Emulator</span><span class="arrow">↗</span></a>
          <a class="game" href="https://s3.amazonaws.com/bullproxy/index.html" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>BullPr0xy</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/Mr-Calvin-Math-Class/modular-primes-5536@main/doesn.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>838gamz</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/opiumbest/svg/index.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Opium backup</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/dogeub/-/index.svg#/docs" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Doge</span><span class="arrow">↗</span></a>
          <a class="game" href="https://quantil.jsdelivr.net/gh/NotAbdullahHD/cherri@main/index.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Cherri</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/lolration/svg/index.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Nocturne</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/npm/opiumbest/index.svg" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>Opium</span><span class="arrow">↗</span></a>
          <a class="game" href="https://cdn.jsdelivr.net/gh/freezenovasrl/cdn/duckmath.svg#" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span>DuckMath</span><span class="arrow">↗</span></a>
        </main>

        <div id="empty" class="empty">No results 💀</div>

        <footer>Alot o links · click one to open it in a new tab</footer>
      </div>

      <script type="text/javascript">
        <![CDATA[
        const search = document.getElementById("search");
        const games = Array.from(document.querySelectorAll(".game"));
        const empty = document.getElementById("empty");

        search.addEventListener("input", () => {
            const q = search.value.trim().toLowerCase();
            let visible = 0;
            games.forEach(game => {
                const show = game.textContent.toLowerCase().includes(q);
                game.style.display = show ? "flex" : "none";
                if (show) visible++;
            });
            empty.style.display = visible ? "none" : "block";
        });
        ]]>
      </script>
    </div>
  </foreignObject>
</svg>
